apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service-go
  namespace: devsecops-prod
  labels:
    app: file-service-go
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: file-service-go
  template:
    metadata:
      labels:
        app: file-service-go
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # ✅ Init container pour attendre MinIO
      initContainers:
        - name: wait-for-minio
          image: busybox:1.35
          command: 
            - 'sh'
            - '-c'
            - |
              echo "Waiting for MinIO to be ready..."
              for i in $(seq 1 60); do
                if nc -zv minio 9000 2>/dev/null; then
                  echo "✅ MinIO is ready!"
                  exit 0
                fi
                echo "[$i/60] MinIO not ready yet, retrying..."
                sleep 2
              done
              echo "❌ MinIO failed to respond after 120 seconds"
              exit 1
      containers:
        - name: file-service-go
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET_KEY
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: file-service-go-secret
                  key: MINIO_ENDPOINT
            - name: MINIO_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: file-service-go-secret
                  key: MINIO_PUBLIC_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: file-service-go-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: file-service-go-secret
                  key: MINIO_SECRET_KEY
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: file-service-go-secret
                  key: MINIO_BUCKET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /tmp/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
