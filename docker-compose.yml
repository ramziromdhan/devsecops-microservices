version: '3.9'

services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://authuser:authpass@auth-db:5432/authdb
      JWT_SECRET_KEY: dev-secret-change-in-prod
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8001:8001"

  app-service:
    build: ./services/app-service
    environment:
      DATABASE_URL: postgresql://appuser:apppass@app-db:5432/appdb
      JWT_SECRET_KEY: dev-secret-change-in-prod
    depends_on:
      app-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8002:8002"

  file-service:
    build: ./services/file-service
    environment:
      JWT_SECRET_KEY: dev-secret-change-in-prod
    ports:
      - "8003:8003"
    volumes:
      - /tmp/uploads:/tmp/uploads

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - app-service
      - file-service

volumes:
  auth-db-data:
  app-db-data: