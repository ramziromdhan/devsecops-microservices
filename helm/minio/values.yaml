replicaCount: 1

image:
  repository: quay.io/minio/minio
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: IfNotPresent

rootUser: "minioadmin"
rootPassword: "minioadmin"

persistence:
  enabled: true
  size: 5Gi

service:
  type: ClusterIP
  apiPort: 9000
  consolePort: 9001

resources:
