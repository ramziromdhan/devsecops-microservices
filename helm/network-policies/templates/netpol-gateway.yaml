apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-gateway
  namespace: devsecops-prod
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}                          # accepte tout (trafic externe)
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: app-service
      ports:
        - port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: file-service-go
      ports:
        - port: 8003
    - to:                         
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
