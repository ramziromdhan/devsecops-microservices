apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-minio
  namespace: devsecops-prod
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: file-service
    ports:
    - protocol: TCP
      port: 9000