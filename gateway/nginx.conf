# gateway/nginx.conf
# Ce fichier est inclus dans le bloc http{} par nginx
# limit_req_zone DOIT être ici, au niveau http (pas dans server{})

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    limit_req zone=api burst=10 nodelay;

    add_header X-Frame-Options         "DENY"                            always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    location /auth/ {
        set $auth http://auth-service:8001;
        proxy_pass         $auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /items {
        set $app http://app-service:8002;
        proxy_pass         $app;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Host              $host;
    }

    location /upload {
        set $file http://file-service:8003;
        proxy_pass         $file;
        proxy_set_header   Authorization     $http_authorization;
        client_max_body_size 10m;
    }

    location /files/ {
        set $file http://file-service:8003;
        proxy_pass         $file;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Host              $host;
        client_max_body_size 100m;
    }

    location /health {
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }
    location /dashboard {
        set $app http://app-service:8002;
        proxy_pass         $app;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
    
}