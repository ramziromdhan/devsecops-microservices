upstream auth_service  { server auth-service:8001; }
upstream app_service   { server app-service:8002; }
upstream file_service  { server file-service:8003; }

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    limit_req zone=api burst=10 nodelay;

    add_header X-Frame-Options        "DENY"                           always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-XSS-Protection       "1; mode=block"                  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location /auth/ {
        proxy_pass         http://auth_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /items {
        proxy_pass         http://app_service;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
    }

    location /upload {
        proxy_pass         http://file_service;
        proxy_set_header   Authorization $http_authorization;
        client_max_body_size 10m;
    }

    location /health {
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }
}