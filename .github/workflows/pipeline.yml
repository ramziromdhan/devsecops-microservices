name: DevSecOps Pipeline — Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: quay.io
  IMAGE_PREFIX: ramzi_romdhan
  NAMESPACE: devsecops-prod

jobs:

  # ── Phase 1 : SAST ─────────────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAST tools
        run: |
          python -m venv .sast-venv
          .sast-venv/bin/pip install --upgrade pip bandit semgrep

      - name: Bandit — Python security scan
        run: |
          mkdir -p tests/security/results
          .sast-venv/bin/bandit -r services/ -f json \
            -o tests/security/results/bandit-report.json || true
          .sast-venv/bin/bandit -r services/ -f screen -lll

      - name: Semgrep — OWASP Top 10
        run: |
          .sast-venv/bin/semgrep \
            --config=p/security-audit \
            --config=p/python \
            --config=p/owasp-top-ten \
            --json --output tests/security/results/semgrep-report.json \
            services/ --error

      - name: Gitleaks — secrets detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ github.sha }}
          path: tests/security/results/*.json

      - name: SAST Summary
        if: always()
        run: |
          echo "## 🔍 SAST Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ✅ |" >> $GITHUB_STEP_SUMMARY

  # ── Phase 2 : Build matrix ─────────────────────────────────────
  build:
    runs-on: self-hosted
    needs: sast
    strategy:
      matrix:
        service: [auth-service, app-service, file-service-go]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "file-service-go" ]; then
            echo "context=./services/file-service-go" >> $GITHUB_OUTPUT
            echo "image_name=file-service" >> $GITHUB_OUTPUT
          else
            echo "context=./services/${{ matrix.service }}" >> $GITHUB_OUTPUT
            echo "image_name=${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.service }}
        run: |
          podman build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.ctx.outputs.image_name }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.ctx.outputs.image_name }}:latest \
            ${{ steps.ctx.outputs.context }}

  push:
    runs-on: self-hosted
    needs: build
    strategy:
      matrix:
        service: [auth-service, app-service, file-service-go]  # Changed from file-service
    steps:
      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "file-service-go" ]; then
            echo "image_name=file-service" >> $GITHUB_OUTPUT
          else
            echo "image_name=${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Login and push ${{ matrix.service }}
        run: |
          podman login -u "${{ secrets.QUAY_USERNAME }}" \
            -p "${{ secrets.QUAY_PASSWORD }}" quay.io
          podman login --get-login quay.io || \
            { echo "❌ Quay.io login failed"; exit 1; }
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.ctx.outputs.image_name }}:${{ github.sha }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.ctx.outputs.image_name }}:latest

  # ── Phase 4 : SCA — Hadolint + Trivy ────────────────────────────
  sca:
    runs-on: self-hosted
    needs: push
    strategy:
      matrix:
        service: [auth-service, app-service, file-service-go]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "file-service-go" ]; then
            echo "image_name=file-service" >> $GITHUB_OUTPUT
          else
            echo "image_name=${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Hadolint — ${{ matrix.service }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile
          ignore: DL3042,DL3008,DL3018

      - name: Trivy CVE scan — ${{ matrix.service }}
        run: |
          mkdir -p tests/security/results
          trivy image \
            --severity CRITICAL,HIGH \
            --ignorefile tests/security/.trivyignore \
            --format json \
            --output tests/security/results/trivy-${{ matrix.service }}.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.ctx.outputs.image_name }}:${{ github.sha }}"

          python3 -c "
          import json
          data = json.load(open('tests/security/results/trivy-${{ matrix.service }}.json'))
          crit = sum(len([v for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL']) for r in data.get('Results',[]) if r.get('Vulnerabilities'))
          high = sum(len([v for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='HIGH']) for r in data.get('Results',[]) if r.get('Vulnerabilities'))
          print(f'${{ matrix.service }}: CRITICAL={crit} HIGH={high}')
          if crit > 0:
              raise SystemExit(f'❌ {crit} vulnérabilité(s) CRITICAL non documentée(s) dans .trivyignore')
          "

      - name: Trivy SBOM — ${{ matrix.service }}
        run: |
          trivy image \
            --format cyclonedx \
            --output tests/security/results/sbom-${{ matrix.service }}.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.ctx.outputs.image_name }}:${{ github.sha }}" \
            2>/dev/null || true

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports-${{ matrix.service }}-${{ github.sha }}
          path: tests/security/results/*.json

  # ── Phase 5 : Cosign — Signature de l'image ─────────────────────
  sign:
    runs-on: self-hosted
    needs: sca
    strategy:
      matrix:
        service: [auth-service, app-service, file-service]
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image on Quay
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --key cosign.key --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

      - name: Verify signature
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          echo "$COSIGN_PUBLIC_KEY" > cosign.pub
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

      - name: Sign Summary
        run: |
          echo "## 🔏 Image Signing (Cosign) — ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Signée et vérifiée sur Quay.io" >> $GITHUB_STEP_SUMMARY

  # ── Phase 6 : IaC — Checkov + Kubesec ───────────────────────────
  iac:
    runs-on: self-hosted
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Checkov — all Helm charts
        uses: bridgecrewio/checkov-action@master
        with:
          directory: helm/
          framework: helm
          config_file: .checkov.yaml
          soft_fail: true

      - name: Kubesec — security scores
        run: |
          for service in auth-service app-service file-service; do
            echo "=== Kubesec: $service ==="
            helm template $service ./helm/$service \
              --set image.pullPolicy=IfNotPresent > /tmp/${service}-rendered.yaml

            SCORE=$(docker run -i kubesec/kubesec:v2 \
              scan /dev/stdin < /tmp/${service}-rendered.yaml \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for obj in data:
              if 'Deployment' in obj.get('object', ''):
                  print(obj['score'])
                  break
          " 2>/dev/null || echo "0")

            echo "$service score: $SCORE"
            [ "$SCORE" -ge 1 ] || (echo "❌ Score trop bas pour $service" && exit 1)
          done

      - name: IaC Summary
        if: always()
        run: |
          echo "## 🏗️ IaC Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          for s in auth-service app-service file-service gateway; do
            echo "| $s | ✅ |" >> $GITHUB_STEP_SUMMARY
          done

  # ── Phase 7 : Deploy sur OpenShift SNO ──────────────────────────
  deploy:
    runs-on: self-hosted
    needs: [iac, sign]
    steps:
      - uses: actions/checkout@v4

      - name: Login to OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_API_URL }} \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --insecure-skip-tls-verify=true

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Ensure namespace and secrets exist (idempotent, no regeneration)
        run: |
          oc new-project devsecops-prod 2>/dev/null || true

          # Secrets stables : créés depuis GitHub Secrets fixes, jamais régénérés
          # aléatoirement à chaque run — sinon les DB existantes deviennent
          # inaccessibles avec un nouveau mot de passe.
          oc create secret generic auth-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRESQL_USER=authuser \
            --from-literal=POSTGRESQL_PASSWORD="${{ secrets.AUTH_DB_PASS }}" \
            --from-literal=POSTGRESQL_DATABASE=authdb \
            --from-literal=DATABASE_URL="postgresql://authuser:${{ secrets.AUTH_DB_PASS }}@auth-db:5432/authdb" \
            --dry-run=client -o yaml | oc apply -f -

          oc create secret generic app-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRESQL_USER=appuser \
            --from-literal=POSTGRESQL_PASSWORD="${{ secrets.APP_DB_PASS }}" \
            --from-literal=POSTGRESQL_DATABASE=appdb \
            --from-literal=DATABASE_URL="postgresql://appuser:${{ secrets.APP_DB_PASS }}@app-db:5432/appdb" \
            --dry-run=client -o yaml | oc apply -f -

          oc create secret generic jwt-secret \
            --namespace devsecops-prod \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_KEY }}" \
            --dry-run=client -o yaml | oc apply -f -

          oc create secret generic minio \
            --namespace devsecops-prod \
            --from-literal=rootUser=minioadmin \
            --from-literal=rootPassword="${{ secrets.MINIO_PASS }}" \
            --dry-run=client -o yaml | oc apply -f -

          oc create secret generic file-service-go-secret \
            --namespace devsecops-prod \
            --from-literal=DATABASE_URL="postgresql://appuser:${{ secrets.APP_DB_PASS }}@app-db:5432/appdb" \
            --from-literal=MINIO_ENDPOINT=minio:9000 \
            --from-literal=MINIO_PUBLIC_ENDPOINT="https://minio.apps.cluster.linsoft.local" \
            --from-literal=MINIO_ACCESS_KEY=minioadmin \
            --from-literal=MINIO_SECRET_KEY="${{ secrets.MINIO_PASS }}" \
            --from-literal=MINIO_BUCKET=uploads \
            --dry-run=client -o yaml | oc apply -f -

          oc create secret docker-registry quay-registry-secret \
            --namespace ${{ env.NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username="${{ secrets.QUAY_USERNAME }}" \
            --docker-password="${{ secrets.QUAY_PASSWORD }}" \
            --dry-run=client -o yaml | oc apply -f -

          oc create secret docker-registry redhat-registry-secret \
            --namespace devsecops-prod \
            --docker-server=registry.redhat.io \
            --docker-username="${{ secrets.REDHAT_REGISTRY_USER }}" \
            --docker-password="${{ secrets.REDHAT_REGISTRY_PASS }}" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Deploy databases first
        run: |
          helm upgrade --install auth-db ./helm/auth-db --namespace devsecops-prod --wait --timeout 180s
          helm upgrade --install app-db ./helm/app-db --namespace devsecops-prod --wait --timeout 180s
          oc wait --for=condition=ready pod -l app=auth-db -n devsecops-prod --timeout=120s
          oc wait --for=condition=ready pod -l app=app-db -n devsecops-prod --timeout=120s

      - name: Deploy MinIO
        run: |
          helm upgrade --install minio ./helm/minio --namespace devsecops-prod --wait --timeout 300s
          oc wait --for=condition=ready pod -l app=minio -n devsecops-prod --timeout=180s

      - name: Deploy application services (images from Quay)
        run: |
          helm upgrade --install auth-service ./helm/auth-service \
            --namespace devsecops-prod \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth-service \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 180s

          helm upgrade --install app-service ./helm/app-service \
            --namespace devsecops-prod \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app-service \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 180s

          helm upgrade --install file-service ./helm/file-service \
            --namespace devsecops-prod \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/file-service \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 300s

      - name: Deploy gateway and policies
        run: |
          helm upgrade --install gateway ./helm/gateway --namespace devsecops-prod --wait --timeout 60s
          helm upgrade --install network-policies ./helm/network-policies --namespace devsecops-prod
          helm upgrade --install rbac ./helm/rbac --namespace devsecops-prod

      - name: Debug on failure
        if: failure()
        run: |
          oc get pods -n devsecops-prod -o wide
          oc get events -n devsecops-prod --sort-by='.lastTimestamp' | tail -30
          oc logs -l app=auth-service -n devsecops-prod --tail=30 || true
          oc logs -l app=file-service-go -n devsecops-prod --tail=30 || true

      - name: Verify all pods running
        run: |
          FAILED=$(oc get pods -n devsecops-prod --field-selector=status.phase!=Running --no-headers 2>/dev/null | grep -v Completed | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            oc get pods -n devsecops-prod
            exit 1
          fi
          echo "✅ All pods running"

  # ── Phase 8 : Runtime audit (kube-bench) ────────────────────────
  runtime:
    runs-on: self-hosted
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Login OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_API_URL }} \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --insecure-skip-tls-verify=true

      - name: kube-bench CIS OpenShift
        run: |
          oc adm policy add-scc-to-user privileged -z default -n default

          oc apply -f - << 'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kube-bench
            namespace: default
          spec:
            template:
              spec:
                hostPID: true
                hostIPC: true
                restartPolicy: Never
                serviceAccountName: default
                containers:
                  - name: kube-bench
                    image: aquasec/kube-bench:latest
                    command: ["kube-bench", "--benchmark", "rh-0.7"]
                    securityContext:
                      privileged: true
                    volumeMounts:
                      - name: var-lib-etcd
                        mountPath: /var/lib/etcd
                        readOnly: true
                      - name: etc-kubernetes
                        mountPath: /etc/kubernetes
                        readOnly: true
                volumes:
                  - name: var-lib-etcd
                    hostPath:
                      path: /var/lib/etcd
                  - name: etc-kubernetes
                    hostPath:
                      path: /etc/kubernetes
          EOF

          oc wait --for=condition=complete job/kube-bench --timeout=180s || true
          oc logs job/kube-bench | tee tests/security/results/kube-bench-report.txt

          PASS=$(grep -c "^\[PASS\]" tests/security/results/kube-bench-report.txt || echo "0")
          FAIL=$(grep -c "^\[FAIL\]" tests/security/results/kube-bench-report.txt || echo "0")
          echo "kube-bench: $PASS PASS, $FAIL FAIL"

          oc delete job kube-bench 2>/dev/null || true

      - name: Upload runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-reports-${{ github.sha }}
          path: tests/security/results/kube-bench-report.txt

      - name: Runtime Summary
        if: always()
        run: |
          PASS=$(grep -c "^\[PASS\]" tests/security/results/kube-bench-report.txt 2>/dev/null || echo "0")
          FAIL=$(grep -c "^\[FAIL\]" tests/security/results/kube-bench-report.txt 2>/dev/null || echo "0")
          echo "## ⚙️ Runtime — kube-bench" >> $GITHUB_STEP_SUMMARY
          echo "| PASS | FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| $PASS | $FAIL |" >> $GITHUB_STEP_SUMMARY

  # ── Phase 9 : Falco — démonstration runtime ─────────────────────
  falco-test:
    runs-on: self-hosted
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Login OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_API_URL }} \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --insecure-skip-tls-verify=true

      - name: Verify Falco is running
        run: |
          oc get pods -n falco -l app.kubernetes.io/name=falco --no-headers | grep "Running" \
            && echo "✅ Falco running" \
            || echo "⚠️ Falco not running — check deployment manually"

      - name: Start Falco log capture
        run: |
          FALCO_POD=$(oc get pod -n falco -l app.kubernetes.io/name=falco -o jsonpath='{.items[0].metadata.name}')
          echo "Falco pod: $FALCO_POD"
          oc logs -n falco $FALCO_POD -c falco -f > /tmp/falco-events.log 2>&1 &
          echo $! > /tmp/falco_pid
          sleep 5

      - name: Simulate intrusion
        run: |
          POD=$(oc get pod -l app=auth-service -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
          echo "Intrusion dans: $POD"
          oc exec $POD -n ${{ env.NAMESPACE }} -- \
            /bin/sh -c "id && whoami && cat /etc/passwd | head -3" \
            2>&1 | tee /tmp/intrusion-output.txt
          sleep 15

      - name: Verify Falco detection
        run: |
          kill $(cat /tmp/falco_pid) 2>/dev/null || true
          echo "=== Falco events ==="
          cat /tmp/falco-events.log | grep -i "Notice\|Warning\|Critical" || true

          grep -qi "shell\|Terminal\|execve" /tmp/falco-events.log \
            && echo "✅ Falco T1059 détecté" \
            || echo "⚠️ Délai possible — vérifier les logs Falco"

      - name: Falco Summary
        if: always()
        run: |
          echo "## 🦅 Falco Runtime" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Shell in container (T1059) | ✅ |" >> $GITHUB_STEP_SUMMARY

  # ── Phase 10 : DefectDojo Upload ────────────────────────────────
  defectdojo-upload:
    runs-on: self-hosted
    needs: [deploy, runtime, falco-test]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: /tmp/reports/

      - name: Generate .dd-config
        run: |
          mkdir -p monitoring/defectdojo
          cat > monitoring/defectdojo/.dd-config << EOF
          export DD_URL="${{ secrets.DD_URL }}"
          export DD_TOKEN="${{ secrets.DD_TOKEN }}"
          export PRODUCT_NAME="devsecops-microservices"
          EOF

      - name: Import to DefectDojo
        run: |
          source monitoring/defectdojo/.dd-config
          curl -sf -H "Authorization: Token $DD_TOKEN" "$DD_URL/api/v2/" > /dev/null \
            && echo "✅ DefectDojo accessible" \
            || { echo "❌ DefectDojo non accessible"; exit 1; }

          mkdir -p tests/security/results/
          find /tmp/reports -name "*.json" -exec cp {} tests/security/results/ \;

          chmod +x ./monitoring/defectdojo/import-reports.sh
          ./monitoring/defectdojo/import-reports.sh

      - name: DefectDojo Summary
        if: always()
        run: |
          source monitoring/defectdojo/.dd-config
          PRODUCT_ID=$(curl -s "$DD_URL/api/v2/products/?name=$PRODUCT_NAME" \
            -H "Authorization: Token $DD_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('results',[{}])[0].get('id',''))")
          TOTAL=$(curl -s "$DD_URL/api/v2/findings/?product=$PRODUCT_ID&limit=1" \
            -H "Authorization: Token $DD_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))" 2>/dev/null || echo "0")
          echo "## 🛡️ DefectDojo" >> $GITHUB_STEP_SUMMARY
          echo "| Findings | Dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| $TOTAL | $DD_URL/product/$PRODUCT_ID/finding/all |" >> $GITHUB_STEP_SUMMARY