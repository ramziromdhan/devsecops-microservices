apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - devsecops-prod
      verifyImages:
        - imageReferences:
            - "quay.io/ramzi_romdhan/*"
          imageRegistryCredentials:
            secrets:
              - quay-creds
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyXQG+5QoI0Uh5sVJ90fm6ZRHfnqC
                      edp2TaQS8ZLMmd695aoNArzwm6y++5WYHeZzKS/KibdtR/kaX/DI/r/f4Q==
                      -----END PUBLIC KEY-----