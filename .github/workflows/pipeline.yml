name: DevSecOps Pipeline — Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/devsecops-microservices

jobs:

  # ── Phase 1 : SAST ─────────────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAST tools
        run: |
          python -m venv .sast-venv
          .sast-venv/bin/pip install --upgrade pip bandit semgrep

      - name: Bandit — Python security scan
        run: |
          .sast-venv/bin/bandit -r services/ -f json \
            -o bandit-report.json || true
          .sast-venv/bin/bandit -r services/ -f screen -lll

      - name: Semgrep — OWASP Top 10
        run: |
          .sast-venv/bin/semgrep \
            --config=p/security-audit \
            --config=p/python \
            --config=p/owasp-top-ten \
            services/ --error

      - name: Gitleaks — secrets detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ github.sha }}
          path: bandit-report.json

      - name: SAST Summary
        if: always()
        run: |
          echo "## 🔍 SAST Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ✅ |" >> $GITHUB_STEP_SUMMARY

  # ── Phase 2 : Build matrix ─────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: sast
    strategy:
      matrix:
        service: [auth-service, app-service, file-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            -t ${{ matrix.service }}:1.0.0 \
            -t ${{ matrix.service }}:latest \
            ./services/${{ matrix.service }}/

      - name: Save image
        run: |
          # Sauvegarder avec TOUS les tags
          docker save \
            ${{ matrix.service }}:${{ github.sha }} \
            ${{ matrix.service }}:1.0.0 \
            ${{ matrix.service }}:latest \
            > /tmp/${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # ── Phase 2 : SCA matrix ───────────────────────────────────────
  sca:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [auth-service, app-service, file-service]
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: /tmp/

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar

      - name: Hadolint — ${{ matrix.service }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile
          ignore: DL3042,DL3008

      - name: Trivy — CVE scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy — SBOM ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          exit-code: "0"

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.json

  # ── Phase 3 : IaC ──────────────────────────────────────────────
  iac:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov — all Helm charts
        uses: bridgecrewio/checkov-action@master
        with:
          directory: helm/
          framework: helm
          config_file: .checkov.yaml
          soft_fail: true

      - name: Kubesec — security scores
        run: |
          for service in auth-service app-service file-service; do
            echo "=== Kubesec: $service ==="
            helm template $service ./helm/$service \
              --set image.pullPolicy=Never > /tmp/${service}-rendered.yaml

            SCORE=$(docker run -i kubesec/kubesec:v2 \
              scan /dev/stdin < /tmp/${service}-rendered.yaml \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for obj in data:
              if 'Deployment' in obj.get('object', ''):
                  print(obj['score'])
                  break
          " 2>/dev/null || echo "0")

            echo "$service score: $SCORE"
            [ "$SCORE" -ge 1 ] || (echo "❌ Score trop bas pour $service" && exit 1)
          done

      - name: IaC Summary
        if: always()
        run: |
          echo "## 🏗️ IaC Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          for s in auth-service app-service file-service gateway; do
            echo "| $s | ✅ |" >> $GITHUB_STEP_SUMMARY
          done

  # ── Phase 4 : Deploy ───────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: iac
    steps:
      - uses: actions/checkout@v4

      - name: Setup k3s
        run: |
          curl -sfL https://get.k3s.io | sh -
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $USER:$USER ~/.kube/config
          # Attendre que k3s soit prêt
          kubectl wait --for=condition=ready node \
            --all --timeout=90s

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*-${{ github.sha }}
          merge-multiple: true
          path: /tmp/images/

      - name: Load images into k3s containerd
        run: |
          for service in auth-service app-service file-service; do
            echo "Loading $service..."
            sudo k3s ctr images import /tmp/images/${service}.tar
          done

          echo "=== Verifying images ==="
          sudo k3s ctr images list | grep -E "auth-service|app-service|file-service"

          # Vérifier que le tag 1.0.0 est bien présent
          for service in auth-service app-service file-service; do
            sudo k3s ctr images list | grep "${service}:1.0.0" \
              && echo "✅ ${service}:1.0.0 found" \
              || echo "❌ ${service}:1.0.0 NOT found"
          done

      - name: Create namespace and secrets
        run: |
          kubectl create namespace devsecops-prod --dry-run=client -o yaml \
            | kubectl apply -f -

          AUTH_PASS=$(openssl rand -base64 20 | tr -d '\n/+=')
          APP_PASS=$(openssl rand -base64 20 | tr -d '\n/+=')
          JWT_KEY=$(openssl rand -base64 48 | tr -d '\n')

          kubectl create secret generic auth-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRES_USER=authuser \
            --from-literal=POSTGRES_PASSWORD=$AUTH_PASS \
            --from-literal=POSTGRES_DB=authdb \
            --from-literal=DATABASE_URL="postgresql://authuser:${AUTH_PASS}@auth-db:5432/authdb" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRES_USER=appuser \
            --from-literal=POSTGRES_PASSWORD=$APP_PASS \
            --from-literal=POSTGRES_DB=appdb \
            --from-literal=DATABASE_URL="postgresql://appuser:${APP_PASS}@app-db:5432/appdb" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic jwt-secret \
            --namespace devsecops-prod \
            --from-literal=JWT_SECRET_KEY="$JWT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy databases first
        run: |
          helm upgrade --install auth-db ./helm/auth-db \
            --namespace devsecops-prod --wait --timeout 180s

          helm upgrade --install app-db ./helm/app-db \
            --namespace devsecops-prod --wait --timeout 180s

          kubectl wait --for=condition=ready pod \
            -l app=auth-db -n devsecops-prod --timeout=120s
          kubectl wait --for=condition=ready pod \
            -l app=app-db  -n devsecops-prod --timeout=120s

          # Attendre que PostgreSQL accepte les connexions
          echo "Waiting 10s for PostgreSQL to accept connections..."
          sleep 10
          echo "✅ Databases ready"

      - name: Deploy application services
        run: |
          # Debug — voir ce que k3s a
          echo "=== k3s images ==="
          sudo k3s ctr images list | grep -E "auth|app|file" || echo "NO IMAGES FOUND"

          # Vérifier que les secrets sont bien là
          kubectl get secrets -n devsecops-prod

          helm upgrade --install auth-service ./helm/auth-service \
            --namespace devsecops-prod \
            --wait --timeout 180s

          helm upgrade --install app-service ./helm/app-service \
            --namespace devsecops-prod \
            --wait --timeout 180s

          helm upgrade --install file-service ./helm/file-service \
            --namespace devsecops-prod \
            --wait --timeout 120s

          echo "✅ Services ready"

      - name: Deploy gateway and policies
        run: |
          helm upgrade --install gateway ./helm/gateway \
            --namespace devsecops-prod --wait --timeout 60s

          helm upgrade --install network-policies ./helm/network-policies \
            --namespace devsecops-prod

          helm upgrade --install rbac ./helm/rbac \
            --namespace devsecops-prod

          echo "✅ Gateway and policies deployed"

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pods status ==="
          kubectl get pods -n devsecops-prod -o wide

          echo "=== auth-service pod events ==="
          kubectl describe pod -l app=auth-service -n devsecops-prod \
            2>/dev/null | tail -20 || echo "No auth-service pod"

          echo "=== auth-service logs ==="
          kubectl logs -l app=auth-service -n devsecops-prod \
            --tail=20 2>/dev/null || echo "No logs"

          echo "=== k3s images ==="
          sudo k3s ctr images list | grep -E "auth|app|file"

          echo "=== Secrets ==="
          kubectl get secrets -n devsecops-prod

          echo "=== Events ==="
          kubectl get events -n devsecops-prod \
            --sort-by='.lastTimestamp' | tail -20


      - name: Verify all pods running
        run: |
          echo "=== All pods status ==="
          kubectl get pods -n devsecops-prod

          # Vérifier qu'aucun pod n'est en erreur
          FAILED=$(kubectl get pods -n devsecops-prod \
            --field-selector=status.phase!=Running \
            --no-headers 2>/dev/null | grep -v "Completed" | wc -l)

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Some pods are not running:"
            kubectl get pods -n devsecops-prod \
              --field-selector=status.phase!=Running
            kubectl describe pods -n devsecops-prod | grep -A 10 "Events:"
            exit 1
          fi
          echo "✅ All pods running"

      - name: Smoke tests
        run: |
          NODE_IP=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[0].address}')
          echo "Gateway: http://$NODE_IP:30080"

          # Attendre que le gateway soit

      - name: Run automated security tests
        run: |
          NODE_IP=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[0].address}')

          # Token frais
          TOKEN=$(curl -s -X POST http://$NODE_IP:30080/auth/token \
            -d "username=ci@test.com&password=Test123!" \
            | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "Token: ${TOKEN:0:20}..."

          # 1. Auth tests
          echo "=== Auth tests ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://$NODE_IP:30080/auth/token \
            -d "username=ci@test.com&password=wrong")
          [ "$CODE" = "401" ] \
            && echo "✅ Wrong password → 401" \
            || echo "❌ Wrong password → $CODE"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://$NODE_IP:30080/items \
            -H "Authorization: Bearer invalid.token")
          [ "$CODE" = "401" ] \
            && echo "✅ Invalid token → 401" \
            || echo "❌ Invalid token → $CODE"

          # 2. Security headers
          echo "=== Security headers ==="
          HEADERS=$(curl -sI http://$NODE_IP:30080/health)
          echo "$HEADERS" | grep -qi "X-Frame-Options" \
            && echo "✅ X-Frame-Options" \
            || echo "❌ X-Frame-Options manquant"
          echo "$HEADERS" | grep -qi "X-Content-Type-Options" \
            && echo "✅ X-Content-Type-Options" \
            || echo "❌ X-Content-Type-Options manquant"

          # 3. Upload security
          echo "=== Upload security ==="
          echo "test" > /tmp/test.txt
          RESULT=$(curl -s -X POST http://$NODE_IP:30080/upload \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@/tmp/test.txt" \
            | python3 -c \
            "import sys,json; d=json.load(sys.stdin); \
             print('OK' if 'filename' in d else 'FAIL')" \
            2>/dev/null || echo "FAIL")
          [ "$RESULT" = "OK" ] \
            && echo "✅ Upload .txt OK" \
            || echo "❌ Upload .txt failed"

          RESULT=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://$NODE_IP:30080/upload \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@/tmp/test.txt;filename=malicious.php")
          [ "$RESULT" = "400" ] \
            && echo "✅ .php blocked → 400" \
            || echo "❌ .php not blocked → $RESULT"

          # 4. ZAP baseline
          echo "=== ZAP DAST scan ==="
          mkdir -p /tmp/zap-results
          docker run --rm \
            --network host \
            -v /tmp/zap-results:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$NODE_IP:30080 \
            -J zap-report.json \
            -I 2>&1 | tail -10 || true

          echo "✅ Security tests completed"

      - name: Security Summary
        if: always()
        run: |
          echo "## 🎯 Security Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Auth enforcement | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Security headers | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload security  | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| ZAP DAST scan    | ✅ |" >> $GITHUB_STEP_SUMMARY

 # ── Phase 5 : Runtime audit ────────────────────────────────────
  runtime:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup k3s
        run: |
          curl -sfL https://get.k3s.io | sh -
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $USER:$USER ~/.kube/config
          kubectl wait --for=condition=ready node --all --timeout=60s

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy minimal cluster for runtime audit
        run: |
          kubectl create namespace devsecops-prod \
            --dry-run=client -o yaml | kubectl apply -f -

          # Secrets minimaux
          AUTH_PASS=$(openssl rand -base64 20 | tr -d '\n/+=')
          APP_PASS=$(openssl rand -base64 20 | tr -d '\n/+=')
          JWT_KEY=$(openssl rand -base64 48 | tr -d '\n')

          kubectl create secret generic auth-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRES_USER=authuser \
            --from-literal=POSTGRES_PASSWORD=$AUTH_PASS \
            --from-literal=POSTGRES_DB=authdb \
            --from-literal=DATABASE_URL="postgresql://authuser:${AUTH_PASS}@auth-db:5432/authdb" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic jwt-secret \
            --namespace devsecops-prod \
            --from-literal=JWT_SECRET_KEY="$JWT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Déployer uniquement pour kube-bench (pas besoin de l'app)
          helm upgrade --install network-policies \
            ./helm/network-policies -n devsecops-prod

      - name: kube-bench — CIS Benchmark
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/aquasecurity/kube-bench/main/job.yaml

          kubectl wait --for=condition=complete \
            job/kube-bench --timeout=180s

          kubectl logs job/kube-bench | tee kube-bench-report.txt
          kubectl delete job kube-bench

          PASS=$(grep -c "^\[PASS\]" kube-bench-report.txt || echo "0")
          FAIL=$(grep -c "^\[FAIL\]" kube-bench-report.txt || echo "0")
          echo "kube-bench: $PASS PASS, $FAIL FAIL"

      - name: Upload runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-reports-${{ github.sha }}
          path: kube-bench-report.txt

      - name: Runtime Summary
        if: always()
        run: |
          PASS=$(grep -c "^\[PASS\]" kube-bench-report.txt 2>/dev/null || echo "0")
          FAIL=$(grep -c "^\[FAIL\]" kube-bench-report.txt 2>/dev/null || echo "0")
          echo "## ⚙️ Runtime Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | PASS | FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| kube-bench CIS | $PASS | $FAIL (k3s limitations) |" \
            >> $GITHUB_STEP_SUMMARY 