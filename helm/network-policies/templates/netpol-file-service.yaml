apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-file-service
  namespace: devsecops-prod
spec:
  podSelector:
    matchLabels:
      app: file-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 8003
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
