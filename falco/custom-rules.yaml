apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: falco
data:
  custom-rules.yaml: |
    # Règle 1 : Détecter l'ouverture d'un shell dans un conteneur
    - rule: Shell Spawned in Container
      desc: Détecte l'exécution d'un shell dans un conteneur (possible intrusion)
      condition: >
        spawned_process and container
        and proc.name in (shell_binaries)
        and not proc.pname in (ok_shell_parents)
      output: >
        ALERTE SÉCURITÉ - Shell ouvert dans conteneur
        (user=%user.name container=%container.name image=%container.image.repository
        cmd=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [container, shell, intrusion, mitre_execution]

    # Règle 2 : Détecter la lecture de fichiers sensibles
    - rule: Read Sensitive File in Container
      desc: Lecture de /etc/passwd ou /etc/shadow dans un conteneur
      condition: >
        open_read and container
        and fd.name in (/etc/passwd, /etc/shadow, /etc/sudoers)
      output: >
        ALERTE - Lecture fichier sensible
        (file=%fd.name container=%container.name pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, file, sensitive]

    # Règle 3 : Détecter une connexion réseau inattendue
    - rule: Unexpected Outbound Network Connection
      desc: Connexion sortante depuis un conteneur vers un port non standard
      condition: >
        outbound and container
        and not fd.sport in (80, 443, 8080, 8443, 5432, 6379)
        and k8s.ns.name = "devsecops-prod"
      output: >
        ALERTE - Connexion réseau suspecte
        (container=%container.name dest=%fd.rip:%fd.rport
        pod=%k8s.pod.name)
      priority: WARNING
      tags: [network, container, suspicious]

    # Règle 4 : Détecter l'écriture dans /tmp (souvent utilisé par malware)
    - rule: Write to /tmp in Container
      desc: Écriture dans /tmp depuis un conteneur de production
      condition: >
        open_write and container
        and fd.directory = /tmp
        and k8s.ns.name = "devsecops-prod"
        and not proc.name in (python3, python, uvicorn)
      output: >
        ALERTE - Écriture dans /tmp
        (file=%fd.name container=%container.name process=%proc.name)
      priority: WARNING
      tags: [container, filesystem, suspicious]