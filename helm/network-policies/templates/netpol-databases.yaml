apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-auth-db
  namespace: devsecops-prod
spec:
  podSelector:
    matchLabels:
      app: auth-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - port: 5432
  egress: []                      # aucun egress autorisé
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-app-db
  namespace: devsecops-prod
spec:
  podSelector:
    matchLabels:
      app: app-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app-service
      ports:
        - port: 5432
  egress: []
