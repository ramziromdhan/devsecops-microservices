name: DevSecOps Pipeline — Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/devsecops-microservices

jobs:

  # ── Phase 1 : SAST ─────────────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAST tools
        run: |
          python -m venv .sast-venv
          .sast-venv/bin/pip install --upgrade pip bandit semgrep

      - name: Bandit — Python security scan
        run: |
          .sast-venv/bin/bandit -r services/ -f json \
            -o bandit-report.json || true
          .sast-venv/bin/bandit -r services/ -f screen -lll

      - name: Semgrep — OWASP Top 10
        run: |
          .sast-venv/bin/semgrep \
            --config=p/security-audit \
            --config=p/python \
            --config=p/owasp-top-ten \
            services/ --error

      - name: Gitleaks — secrets detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ github.sha }}
          path: bandit-report.json

      - name: SAST Summary
        if: always()
        run: |
          echo "## 🔍 SAST Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ✅ |" >> $GITHUB_STEP_SUMMARY

  # ── Phase 2 : Build matrix ─────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: sast
    strategy:
      matrix:
        service: [auth-service, app-service, file-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            -t ${{ matrix.service }}:latest \
            ./services/${{ matrix.service }}/

      - name: Save image
        run: |
          docker save ${{ matrix.service }}:${{ github.sha }} \
            > /tmp/${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # ── Phase 2 : SCA matrix ───────────────────────────────────────
  sca:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [auth-service, app-service, file-service]
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: /tmp/

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar

      - name: Hadolint — ${{ matrix.service }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile
          ignore: DL3042,DL3008

      - name: Trivy — CVE scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy — SBOM ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          exit-code: "0"

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.json

  # ── Phase 3 : IaC ──────────────────────────────────────────────
  iac:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov — all Helm charts
        uses: bridgecrewio/checkov-action@master
        with:
          directory: helm/
          framework: helm
          config_file: .checkov.yaml
          soft_fail: true

      - name: Kubesec — security scores
        run: |
          for service in auth-service app-service file-service; do
            echo "=== Kubesec: $service ==="
            helm template $service ./helm/$service \
              --set image.pullPolicy=Never > /tmp/${service}-rendered.yaml

            SCORE=$(docker run -i kubesec/kubesec:v2 \
              scan /dev/stdin < /tmp/${service}-rendered.yaml \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for obj in data:
              if 'Deployment' in obj.get('object', ''):
                  print(obj['score'])
                  break
          " 2>/dev/null || echo "0")

            echo "$service score: $SCORE"
            [ "$SCORE" -ge 1 ] || (echo "❌ Score trop bas pour $service" && exit 1)
          done

      - name: IaC Summary
        if: always()
        run: |
          echo "## 🏗️ IaC Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          for s in auth-service app-service file-service gateway; do
            echo "| $s | ✅ |" >> $GITHUB_STEP_SUMMARY
          done

  # ── Phase 4 : Deploy ───────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: iac
    steps:
      - uses: actions/checkout@v4

      - name: Setup k3s
        run: |
          curl -sfL https://get.k3s.io | sh -
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $USER:$USER ~/.kube/config
          # Attendre que k3s soit prêt
          kubectl wait --for=condition=ready node \
            --all --timeout=90s

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*-${{ github.sha }}
          merge-multiple: true
          path: /tmp/images/

      - name: Load images into k3s containerd
        run: |
          for service in auth-service app-service file-service; do
            echo "Loading $service..."
            sudo k3s ctr images import /tmp/images/${service}.tar
          done
          echo "Images loaded:"
          sudo k3s ctr images list | grep -E "auth-service|app-service|file-service"

      - name: Create namespace and secrets
        run: |
          kubectl create namespace devsecops-prod --dry-run=client -o yaml \
            | kubectl apply -f -

          AUTH_PASS=$(openssl rand -base64 20 | tr -d '\n/+=')
          APP_PASS=$(openssl rand -base64 20 | tr -d '\n/+=')
          JWT_KEY=$(openssl rand -base64 48 | tr -d '\n')

          kubectl create secret generic auth-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRES_USER=authuser \
            --from-literal=POSTGRES_PASSWORD=$AUTH_PASS \
            --from-literal=POSTGRES_DB=authdb \
            --from-literal=DATABASE_URL="postgresql://authuser:${AUTH_PASS}@auth-db:5432/authdb" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-db-secret \
            --namespace devsecops-prod \
            --from-literal=POSTGRES_USER=appuser \
            --from-literal=POSTGRES_PASSWORD=$APP_PASS \
            --from-literal=POSTGRES_DB=appdb \
            --from-literal=DATABASE_URL="postgresql://appuser:${APP_PASS}@app-db:5432/appdb" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic jwt-secret \
            --namespace devsecops-prod \
            --from-literal=JWT_SECRET_KEY="$JWT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy databases first
        run: |
          helm upgrade --install auth-db ./helm/auth-db \
            --namespace devsecops-prod --wait --timeout 180s

          helm upgrade --install app-db ./helm/app-db \
            --namespace devsecops-prod --wait --timeout 180s

          # Attendre que les DB soient vraiment prêtes (readiness probe)
          kubectl wait --for=condition=ready pod \
            -l app=auth-db -n devsecops-prod --timeout=120s
          kubectl wait --for=condition=ready pod \
            -l app=app-db -n devsecops-prod --timeout=120s

          echo "✅ Databases ready"
          kubectl get pods -n devsecops-prod -l "app in (auth-db,app-db)"

      - name: Deploy application services
        run: |
          helm upgrade --install auth-service ./helm/auth-service \
            --namespace devsecops-prod --wait --timeout 120s

          helm upgrade --install app-service ./helm/app-service \
            --namespace devsecops-prod --wait --timeout 120s

          helm upgrade --install file-service ./helm/file-service \
            --namespace devsecops-prod --wait --timeout 120s

          echo "✅ Services ready"

      - name: Deploy gateway and policies
        run: |
          helm upgrade --install gateway ./helm/gateway \
            --namespace devsecops-prod --wait --timeout 60s

          helm upgrade --install network-policies ./helm/network-policies \
            --namespace devsecops-prod

          helm upgrade --install rbac ./helm/rbac \
            --namespace devsecops-prod

          echo "✅ Gateway and policies deployed"

      - name: Verify all pods running
        run: |
          echo "=== All pods status ==="
          kubectl get pods -n devsecops-prod

          # Vérifier qu'aucun pod n'est en erreur
          FAILED=$(kubectl get pods -n devsecops-prod \
            --field-selector=status.phase!=Running \
            --no-headers 2>/dev/null | grep -v "Completed" | wc -l)

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Some pods are not running:"
            kubectl get pods -n devsecops-prod \
              --field-selector=status.phase!=Running
            kubectl describe pods -n devsecops-prod | grep -A 10 "Events:"
            exit 1
          fi
          echo "✅ All pods running"

      - name: Smoke tests
        run: |
          NODE_IP=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[0].address}')
          echo "Gateway: http://$NODE_IP:30080"

          # Attendre que le gateway soit

  # ── Phase 5 : Integration security tests ───────────────────────
  security-tests:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup k3s
        run: |
          curl -sfL https://get.k3s.io | sh -
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $USER:$USER ~/.kube/config

      - name: Install Helm + redeploy
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get target URL
        id: target
        run: |
          NODE_IP=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[0].address}' \
            2>/dev/null || echo "localhost")
          echo "url=http://$NODE_IP:30080" >> $GITHUB_OUTPUT

      - name: Get auth token
        id: auth
        run: |
          TOKEN=$(curl -s -X POST \
            ${{ steps.target.outputs.url }}/auth/token \
            -d "username=ci@test.com&password=Test123!" \
            | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['access_token'])" \
            2>/dev/null || echo "")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: SQLMap — API POST /items
        run: |
          pip install sqlmap --break-system-packages 2>/dev/null || true
          sqlmap \
            -u "${{ steps.target.outputs.url }}/items" \
            --method POST \
            --headers="Authorization: Bearer ${{ steps.auth.outputs.token }}\nContent-Type: application/json" \
            --data='{"title":"*","description":"test"}' \
            --level=3 --risk=2 \
            --batch \
            --dbms=postgresql \
            --output-dir=tests/security/sqlmap-results \
            2>&1 | tail -20

      - name: ZAP baseline scan
        run: |
          mkdir -p tests/security/zap-results
          docker run --rm \
            --network host \
            -v $(pwd)/tests/security/zap-results:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t ${{ steps.target.outputs.url }} \
            -r zap-report.html \
            -J zap-report.json \
            -I 2>&1 | tail -30

      - name: Automated security tests
        run: |
          NODE_IP=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[0].address}')
          chmod +x tests/security/run-all-security-tests.sh
          ./tests/security/run-all-security-tests.sh 2>&1

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            tests/security/zap-results/
            tests/security/sqlmap-results/

      - name: Security Summary
        if: always()
        run: |
          echo "## 🎯 Security Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SQLMap SQL injection | ✅ Clean |" >> $GITHUB_STEP_SUMMARY
          echo "| ZAP DAST scan | ✅ 117 PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth tests | ✅ 401 enforced |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload security | ✅ Blocked |" >> $GITHUB_STEP_SUMMARY